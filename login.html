<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login - Cricket Turf Booking</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="nav-brand">🏏 <span>Turf</span>Arena</a>
        <div class="nav-links">
            <a href="index.html" class="nav-link">Home</a>
            <a href="turfs.html" class="nav-link">Turfs</a>
            <a href="register.html" class="nav-link">Register</a>
        </div>
    </nav>

    <div class="overlay">
        <div class="auth-wrapper">
            <div class="glass-card">
                <h2>Welcome Back! 🏏</h2>
                <p class="card-subtitle">Login to book cricket pitches and manage your match slots</p>

                <!-- Live Status Feedback Message -->
                <div id="loginStatusBox" style="display: none; padding: 12px; border-radius: var(--radius-sm); margin-bottom: 16px; font-weight: 600; text-align: center;"></div>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="name@example.com" required autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                    </div>

                    <button type="submit" id="login" class="btn btn-primary btn-block" style="margin-top: 10px; padding: 14px; font-size: 16px;">
                        🏏 Login to Account
                    </button>
                </form>

                <div class="form-footer">
                    Don't have an account? <a href="register.html">Register here</a>
                    <br><br>
                    <a href="admin.html" style="color: var(--accent-purple); font-size: 13px;">Admin Portal Login →</a>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
