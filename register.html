<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration - Cricket Turf Booking</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="nav-brand">🏏 <span>Turf</span>Arena</a>
        <div class="nav-links">
            <a href="index.html" class="nav-link">Home</a>
            <a href="turfs.html" class="nav-link">Turfs</a>
            <a href="login.html" class="nav-link">Login</a>
        </div>
    </nav>

    <div class="overlay">
        <div class="auth-wrapper">
            <div class="glass-card">
                <h2>Create Account 🏏</h2>
                <p class="card-subtitle">Sign up to reserve cricket pitches across your city</p>

                <!-- Live Status Feedback Message -->
                <div id="registerStatusBox" style="display: none; padding: 12px; border-radius: var(--radius-sm); margin-bottom: 16px; font-weight: 600; text-align: center;"></div>

                <form id="registerForm">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" class="form-control" placeholder="e.g. Virat Sharma" required autocomplete="name">
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="name@example.com" required autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
                    </div>

                    <button type="submit" id="register" class="btn btn-primary btn-block" style="margin-top: 10px; padding: 14px; font-size: 16px;">
                        ⚡ Create Account & Explore Turfs
                    </button>
                </form>

                <div class="form-footer">
                    Already have an account? <a href="login.html">Login here</a>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
