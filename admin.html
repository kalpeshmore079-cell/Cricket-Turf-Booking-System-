<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login - Cricket Turf Booking</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="nav-brand">🏏 <span>Turf</span>Arena</a>
        <div class="nav-links">
            <a href="index.html" class="nav-link">Home</a>
            <a href="login.html" class="nav-link">User Login</a>
        </div>
    </nav>

    <div class="overlay">
        <div class="auth-wrapper">
            <div class="glass-card">
                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 6px;">
                    <span style="font-size: 28px;">🛡️</span>
                    <h2 style="margin: 0;">Admin Portal</h2>
                </div>
                <p class="card-subtitle">Manage turfs, view all bookings, and set pricing</p>

                <div class="slot-notice" style="background: #f0fdf4; border-color: #10b981; color: #166534; margin-bottom: 20px;">
                    <b>Default Admin Credentials:</b><br>
                    📧 Email: <code>admin@gmail.com</code><br>
                    🔑 Password: <code>admin123</code>
                </div>

                <!-- Live Status Message Box -->
                <div id="adminStatusBox" style="display: none; padding: 12px; border-radius: var(--radius-sm); margin-bottom: 16px; font-weight: 600; text-align: center;"></div>

                <form id="adminLoginForm">
                    <div class="form-group">
                        <label for="email">Admin Email Address</label>
                        <input type="email" id="email" class="form-control" value="admin@gmail.com" placeholder="admin@gmail.com" required autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label for="password">Admin Password</label>
                        <input type="password" id="password" class="form-control" value="admin123" placeholder="admin123" required autocomplete="current-password">
                    </div>

                    <button type="submit" id="adminLogin" class="btn btn-purple btn-block" style="margin-top: 10px; font-size: 16px; padding: 14px;">
                        🔑 Authenticate & Enter Dashboard
                    </button>
                </form>

                <div class="form-footer">
                    <a href="login.html">← Back to User Login</a>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/admin.js"></script>
</body>
</html>
